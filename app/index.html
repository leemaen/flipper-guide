<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flipper-Guide">
<title>Flipper-Guide</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- Bibliothek -->
  <section id="library" class="screen" hidden>
    <header class="lib-head">
      <h1>Flipper-Guide</h1>
      <p class="muted">Meine Tische</p>
    </header>
    <div id="libList" class="lib-list"></div>
    <p class="lib-foot muted" id="libOffline"></p>
  </section>

  <!-- Tisch -->
  <section id="table" class="screen" hidden>
    <header class="topbar">
      <button class="icon-btn" id="btnLib" aria-label="Zur Tischauswahl">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
      </button>
      <div class="title">
        <div class="t-name" id="tName"></div>
        <div class="t-sub" id="tSub"></div>
      </div>
      <div class="seg seg-sm" id="viewSeg" role="tablist" aria-label="Ansicht"></div>
      <button class="icon-btn" id="btnInfo" aria-label="Info und Quellen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg>
      </button>
    </header>

    <div class="table-main">
      <div id="stage" class="stage">
        <div id="pfWrap" class="pf-wrap">
          <img id="pfImg" alt="Spielfeld" draggable="false">
          <svg id="pfSvg" class="pf-svg" aria-hidden="true"></svg>
        </div>
        <div class="stage-ui">
          <button class="fab fs-only fs-back" id="btnFsLib" aria-label="Zur Tischauswahl">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <div class="stage-btns">
            <button class="fab" id="btnFs" aria-label="Vollbild">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
            </button>
            <button class="fab" id="btnFit" aria-label="Ganzes Spielfeld zeigen">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><circle cx="12" cy="9" r="1.6"/></svg>
            </button>
          </div>
          <div id="fsBar" class="fs-bar" hidden></div>
          <div id="corrBar" class="corr-bar" hidden>
            <span>Korrekturmodus: markierten Schuss mit dem Finger verschieben</span>
            <button class="pill ghost sm" id="btnCorrReset">Zurücksetzen</button>
          </div>
        </div>
      </div>

      <div id="panel" class="panel"></div>
    </div>
  </section>
</div>

<div id="infoSheet" class="info-sheet" hidden role="dialog" aria-label="Info und Quellen">
  <div class="is-head"><b>Info und Quellen</b><button class="pill ghost sm" id="btnInfoClose">Schließen</button></div>
  <div class="is-body" id="infoBody"></div>
</div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
